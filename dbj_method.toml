# dbj_method.toml - canonical definitions of the DBJ Method.
# One definition, one place. Chapters render these; nobody copies them.
# Published verbatim at https://method.dbj.org/dbj_method.toml
#
# Addressing: every definition has a dotted key path, e.g. bpt.domain.technology.mandate
# Where sequence matters, the item carries an explicit "order".

[meta]
version = "0.1"
rule    = "Official vocabulary. No synonyms, no reinterpretation. Keywords."
method  = "Products factory delivering at the speed of AI"

# ---------------- TAXONOMY ----------------
[taxonomy]
definition = "Hierarchical structure and the naming of the organisation's information space. Organisation common language definition."
schema     = "Hierarchy. First level: 4 Categories. Second level: 4 Capabilities per Category. The DBJ Taxonomy fixes the count at four; other taxonomies may have more."
scope      = "Organisation Information Space"

[taxonomy.category.conceptual]
order        = 1
name         = "Conceptual"
capabilities = ["Business", "Information", "Application", "Technology"]

[taxonomy.category.logical]
order        = 2
name         = "Logical"
capabilities = ["Data Management", "Integration", "Platform", "Security"]

[taxonomy.category.physical]
order        = 3
name         = "Physical"
capabilities = ["Compute", "Infrastructure", "Network", "Storage"]

[taxonomy.category.implementation]
order        = 4
name         = "Implementation"
capabilities = ["Deployment", "Development", "Monitoring", "Operations"]

# ---------------- CMM ----------------
[cmm]
definition = "DBJ Capability Maturity Model. Encapsulates the TOGAF CMM (same scale). Covers the whole organisation; no just the architectural roles."
elements   = [
  "Governance",
  "Skilled Resource Pool",
  "Projects / Portfolios",
  "Business Operations",
  "Architecture Repository",
]
element_assessment    = "Each element scored independently on Level 0 (L0) to Level 5 (L5)."
starting               = "L3"
required              = "L5 across all five elements."
entry_ticket          = "Personal proof of a passed DBJ CMM L5 exam. No one works inside BPT, or on a DBJ ADM wheel, without L5 Pass."
organisation_maturity = "Aiming for L5. Sum of the domain teams' maturities; a team's maturity is the sum of its people's maturities."

[cmm.level.l0]
togaf   = "M0"
name    = "None"
meaning = "No recognizable structure in this element"

[cmm.level.l1]
togaf   = "M1"
name    = "Initial"
meaning = "Activity exists but is ad-hoc and person-dependent"

[cmm.level.l2]
togaf   = "M2"
name    = "Under Development"
meaning = "Processes being defined; inconsistently applied"

[cmm.level.l3]
togaf   = "M3"
name    = "Defined"
meaning = "Documented process, standardized, consistently followed"

[cmm.level.l4]
togaf   = "M4"
name    = "Managed"
meaning = "Measured, monitored, actively controlled process"

[cmm.level.l5]
togaf   = "M5"
name    = "Optimising"
meaning = "Continuous improvement embedded in normal operation"

# ---------------- ADM ----------------
[adm]
definition       = "DBJ ADM. Encapsulates TOGAF ADM: five steps around Requirements Management at the hub. Business is in the driving seat. Outputs are architectural content(decisions, principles, constraints, blueprints), not deployed systems. Present in each domain. Decoupled cycling. Agile."
deliverable_rule = "Each step produces exactly one deliverable, by the same name. All five must co-exist and be signed off before a cycle closes."
versioning       = "The whole-number part of a document version is the cycle number. 1.0 = first cycle closed."

[adm.step.strategy_and_motivation]
order       = 1
name        = "Strategy & Motivation"
taxonomy    = "conceptual"
deliverable = "Constraints and non-negotiables that govern the entire wheel"

[adm.step.business]
order       = 2
name        = "Business"
taxonomy    = "conceptual"
deliverable = "Business case, scope, and stakeholder sign-off"

[adm.step.application]
order       = 3
name        = "Application"
taxonomy    = "logical"
deliverable = "Logical architecture: information systems and their interfaces"

[adm.step.technology]
order       = 4
name        = "Technology"
taxonomy    = "physical"
deliverable = "Physical architecture: infrastructure, platforms, and deployment topology"

[adm.step.implementation]
order       = 5
name        = "Implementation"
taxonomy    = "implementation"
deliverable = "Approved path forward, sequencing, cost, and governance sign-off"

# ---------------- BPT ----------------
[bpt]
definition   = "One production line pre product of the products factory: three decoupled domains, Business, Products, Technology, cycling in parallel and exchanging information asynchronously (the BPT Loop)."
one_bpt      = "One product == one production line == one BPT. An organisation can have 1 to N BPTs. Scalability is vertical, per domain, when required. A DBJ ADM wheel accommodates teams from 2 to N."
wheel        = "Each domain contains one DBJ ADM wheel. Each wheel delivers five deliverables."
traceability = "Every deliverable is traceable to the domain it originated from. Domain association is always explicit, even where roles overlap. Issue origin must be preserved."
slogan       = "Product unifies; Loop validates."

[bpt.domain.business]
order   = 1
name    = "Business"
mandate = "Defines strategic intent. Owns the why of each initiative. Commissions work and conducts final approval."

[bpt.domain.products]
order   = 2
name    = "Products"
mandate = "From WHY to WHAT. Translates strategy into requirements. Business workflows. Owns the how. Bridge between Business intent and Technology execution."

[bpt.domain.technology]
order   = 3
name    = "Technology"
mandate = "The HOW. Builds, integrates, and deploys. Maintenance of the product lifecycle."

[bpt.product]
definition  = "Whatever the Business declares and Technology implements: software, service, documentation, process description, a physical book, a company event management process or manual."
description = "Fully described by 3 domains x 5 = 15 deliverables: three domains, one ADM each, five deliverables per ADM."

[bpt.cycle]
definition = "The information iteration between two adjacent domains."
closure    = "A cycle is satisfied when the two adjacent domains agree. What is agreed depends on the domains and the kind of Product."

[bpt.cycle.one]
order   = 1
between = ["business", "products"]

[bpt.cycle.two]
order   = 2
between = ["products", "technology"]

[bpt.stream.require]
order  = 1
name   = "Require"
intent = "Business declares initiatives; product refines them."
between = ["business", "products"]

[bpt.stream.develop]
order  = 2
name   = "Develop"
intent = "Information for Technology to builds to product specifications"
between = ["products", "technology"]

[bpt.stream.deploy]
order  = 3
name   = "Deploy"
intent = "Technology prepares the product for UAT. Products manages the UAT. After UAT is passed, Business gives final approval and the Product is released into operations."
between = ["products", "technology"]

[bpt.stream.evaluate]
order  = 4
name   = "Evaluate"
intent = "Measure outcomes against business objectives; feed back into the next cycle. Final approval."
between = ["business", "products"]

[bpt.domain_lead]
definition = "Role each domain appoints, responsible for architecture decisions within the domain scope. Co-owns BPT cycle governance."
